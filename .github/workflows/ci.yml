name: eval

on:
  push:
  pull_request:
  workflow_dispatch:

# Offline only, on purpose: this public repo never calls a model in CI. The
# judged run is a local command for anyone with their own key (see README).
# A scheduled judged job used to live here; with no key set it failed every
# run at the API and still went green, which is worse than no job at all.
jobs:
  # Every push. No API key, no cost, seconds to run.
  fast:
    name: graders + dataset (offline)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt

      - name: Validate the dataset
        run: python scripts/validate_dataset.py

      - name: Unit-test the graders and reporters
        run: pytest -q

      - name: Offline suite against recorded fixtures, every agent
        env:
          EVAL_FAKE: "1"
        run: |
          for agent in support shop; do
            python scripts/run_eval.py --agent "$agent" --no-judge --reps 1 --no-gate
          done

      # always() so a failing suite still produces its reports -- a red run is
      # exactly when you most need to see what broke.
      - name: Reports
        if: always()
        continue-on-error: true
        run: |
          for agent in support shop; do
            python scripts/report_junit.py --agent "$agent"
            python scripts/report_html.py --agent "$agent"
            python scripts/report_summary.py --agent "$agent" --github
            python scripts/assessment.py --agent "$agent"
          done

      - name: Keep the reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eval-offline-reports
          path: results/
          retention-days: 14
